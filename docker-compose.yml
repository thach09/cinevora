# =====================================================================
# CINEVORA - Docker Compose (Local Development)
# ---------------------------------------------------------------------
# Phase 1  : PostgreSQL 16 + Flyway CLI (profile "tools")
# Phase 5  : full-stack local development; cloud uses prod + object storage.
#
# Su dung:
#   docker compose up -d postgres                       # chi khoi dong DB
#   docker compose ps                                    # kiem tra health
#   docker compose logs -f postgres                      # xem log
#   docker compose down                                  # tat (giu volume)
#   docker compose up --build                            # full stack
#
#   # Chay migration (khong can cai Java/Maven tren may host):
#   docker compose --profile tools run --rm flyway
#
#   # Doi chieu trang thai migration:
#   docker compose --profile tools run --rm flyway info
#
# File .env duoc nap tu dong (xem .env.example). KHONG commit file .env.
# =====================================================================

services:
  # -------------------------------------------------------------------
  # PostgreSQL 16 - database chinh cua Cinevora
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: ${POSTGRES_CONTAINER_NAME:-cinevora-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinevora_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
      # Ep UTF8 + collation "C" de ket qua deterministic, khong phu thuoc
      # locale cua may host (PostgreSQL cho phep C collation voi UTF8).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cinevora_pgdata:/var/lib/postgresql/data
    healthcheck:
      # healthcheck nay la dieu kien depends_on cua service flyway
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cinevora_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - cinevora-net

  # -------------------------------------------------------------------
  # Flyway CLI - chay migration V1/V2 bang Docker, khong can host tools.
  # Nam trong profile "tools" nen `docker compose up` KHONG khoi dong no.
  # -------------------------------------------------------------------
  flyway:
    image: flyway/flyway:10-alpine@sha256:94a81ca7db9a9f24fd8acd7463fa4560cb8f66aae2aa64485c27eb296f5851cf
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount read-only: Flyway chi doc file SQL, khong ghi nguoc.
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro
    environment:
      # Khai bao tuong minh de tat canh bao cua Flyway 10:
      #   "Storing migrations in 'sql' is not recommended and default
      #    scanning of this location may be deprecated in a future release"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cinevora_db}
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
    command: migrate
    networks:
      - cinevora-net

  backend:
    image: ${BACKEND_IMAGE:-cinevora-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cinevora_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the shell}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088}
      APP_AUTH_EXPOSE_DEVELOPMENT_TOKENS: "false"
      MEDIA_STORAGE: local
      MEDIA_STORAGE_ROOT: /app/uploads/media
      PORT: "8080"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - cinevora_media:/app/uploads/media
    stop_grace_period: 35s
    networks:
      - cinevora-net

  frontend:
    image: ${FRONTEND_IMAGE:-cinevora-frontend:local}
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:8080"
    networks:
      - cinevora-net

volumes:
  cinevora_pgdata:
    name: ${POSTGRES_VOLUME_NAME:-cinevora_pgdata}
  cinevora_media:
    name: ${MEDIA_VOLUME_NAME:-cinevora_media}

networks:
  cinevora-net:
    name: ${COMPOSE_NETWORK_NAME:-cinevora-net}
    driver: bridge
