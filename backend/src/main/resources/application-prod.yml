spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:}:${DB_PORT:5432}/${DB_NAME:}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 30000
      data-source-properties:
        sslmode: ${DB_SSL_MODE:require}
        connectTimeout: 10
        socketTimeout: 30
  jpa:
    show-sql: false
logging:
  level:
    root: INFO
    com.cinevora: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    software.amazon.awssdk: WARN
debug: false
trace: false
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    block-demo-identities: true
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    expose-development-tokens: false
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
  media:
    storage: ${MEDIA_STORAGE:s3}
