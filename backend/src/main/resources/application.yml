spring:
  application:
    name: cinevora-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MEDIA_POSTER_MAX_SIZE:5MB}
      max-request-size: ${MEDIA_REQUEST_MAX_SIZE:6MB}
server:
  forward-headers-strategy: none
  max-http-request-header-size: 8KB
  tomcat:
    max-connections: 200
    accept-count: 50
    connection-timeout: 10s
    keep-alive-timeout: 15s
    threads:
      max: 40
      min-spare: 4
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  auth:
    refresh-days: ${AUTH_REFRESH_DAYS:30}
    expose-development-tokens: ${AUTH_EXPOSE_DEVELOPMENT_TOKENS:false}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  media:
    storage: ${MEDIA_STORAGE:local}
    storage-root: ${MEDIA_STORAGE_ROOT:uploads/media}
    s3:
      endpoint: ${MEDIA_S3_ENDPOINT:}
      region: ${MEDIA_S3_REGION:auto}
      bucket: ${MEDIA_S3_BUCKET:}
      public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
    poster:
      max-size-bytes: ${MEDIA_POSTER_MAX_SIZE_BYTES:5242880}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
