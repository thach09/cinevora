spring:
  application:
    name: cinevora-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MEDIA_POSTER_MAX_SIZE:5MB}
      max-request-size: ${MEDIA_REQUEST_MAX_SIZE:6MB}
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-cinevora-secret-key-must-be-at-least-32-bytes-long-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  media:
    storage-root: ${MEDIA_STORAGE_ROOT:uploads/media}
    poster:
      max-size-bytes: ${MEDIA_POSTER_MAX_SIZE_BYTES:5242880}
management:
  endpoints:
    web:
      exposure:
        include: health,info
