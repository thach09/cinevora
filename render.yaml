# Free evaluation only: Render Free PostgreSQL expires after 30 days.
# Supply external secrets in Render. No paid service is created by this Blueprint.
databases:
  - name: cinevora-db
    plan: free
    region: singapore
    databaseName: cinevora
    user: cinevora
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: cinevora-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: off
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase: { name: cinevora-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: cinevora-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: cinevora-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: cinevora-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: cinevora-db, property: password }
      - key: DB_SSL_MODE
        value: require
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Set to the exact HTTPS frontend origin on the same site as the API.
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: MEDIA_STORAGE
        value: s3
      - key: MEDIA_S3_ENDPOINT
        sync: false
      - key: MEDIA_S3_REGION
        value: auto
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: MEDIA_S3_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_SECRET_KEY
        sync: false
